[workspace]
members = ["sys", "cli"]

[workspace.package]
authors = ["Flavio Bizzarri <fl.bizzarri@gmail.com>"]
version = "0.1.20"
edition = "2024"
license = "MIT"
repository = "https://github.com/newfla/diffusion-rs"
keywords = ["ai", "stable-diffusion", "flux"]

[package]
name = "diffusion-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
description = "High level API for stable-diffusion.cpp"
documentation = "https://docs.rs/diffusion-rs"


[dependencies]
chrono.workspace = true
derive_builder = "0.20.2"
diffusion-rs-sys = { path = "sys", version = "0.1.20" }
hf-hub = { version = "1.0.0", default-features = false, features = [
    "blocking",
] }
image = "0.25.10"
libc = "0.2.186"
little_exif = "0.6.23"
num_cpus = "1.17.0"
strum.workspace = true
subenum = "1.2.0"
thiserror = "2.0.19"
walkdir = "2.5.0"

[workspace.dependencies]
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["default", "derive"] }
execution-time = "0.3.1"
strum = { version = "0.28.0", features = ["derive"] }

[features]
cuda = ["diffusion-rs-sys/cuda"]
hipblas = ["diffusion-rs-sys/hipblas"]
metal = ["diffusion-rs-sys/metal"]
vulkan = ["diffusion-rs-sys/vulkan"]
sycl = ["diffusion-rs-sys/sycl"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
